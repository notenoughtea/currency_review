services:
  db:
    image: postgres:15
    container_name: currency_db
    environment:
      POSTGRES_DB: currency_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5111:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d currency_db -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer
    container_name: currency_adminer
    restart: always
    ports:
      - "8080:8080"

  migrator:
    build: .
    container_name: currency_migrator
    command: ["/bin/migrator"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONFIG_PATH: /app/config.yaml
    restart: "no"

  currency:
    build: .
    container_name: currency_service
    command: ["/bin/currency"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  cron:
    build: .
    container_name: currency_cron
    command: ["/bin/cron"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml

  gateway:
    build: .
    container_name: currency_gateway
    command: ["/bin/gateway"]
    depends_on:
      db:
        condition: service_healthy
      currency:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      CONFIG_PATH: /app/config.yaml
      CURRENCY_GRPC_ADDR: currency:50051

volumes:
  db_data:
